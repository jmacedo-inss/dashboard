<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
  // Garante que a página sempre tenha "/" no final da URL, senão os caminhos
  // relativos (../shared/...) resolvem errado.
  if (!location.pathname.endsWith('/')) {
    location.replace(location.pathname + '/' + location.search + location.hash);
  }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupo J.Macedo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/supabase-client.js"></script>
<link rel="stylesheet" href="../shared/sidebar.css">
<script src="../shared/sidebar.js"></script>
<link rel="stylesheet" href="../shared/gestao.css">
<script src="../shared/gestao.js"></script>
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#EEF2F8;color:#101827;font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased;}
  .app-shell{display:flex;min-height:100vh;align-items:stretch;}
  .app-main{flex:1;min-width:0;}
  .rota{display:none;}
  .rota.ativa{display:block;}
  .rota-placeholder{padding:60px;text-align:center;color:#8994A8;font-family:'Outfit',sans-serif;font-size:15px;}
</style>
</head>
<body>

<div class="app-shell" id="app-shell" hidden>
  <div id="sidebar-mount"></div>
  <main class="app-main">
    <div class="rota" id="rota-dashboard">
      <div class="rota-placeholder">Dashboard — conteúdo chega na próxima etapa.</div>
    </div>
    <div class="rota" id="rota-pedidos">
      <div class="rota-placeholder">Pedidos — conteúdo chega na próxima etapa.</div>
    </div>
  </main>
</div>

<script>
  // ---------------- Roteador client-side ----------------
  function calcularBase_(){
    var partes = location.pathname.split('/').filter(Boolean);
    partes.pop(); // remove "dashboard" ou "express", sobra só a raiz do site
    return '/' + partes.join('/') + '/';
  }
  var BASE = calcularBase_();
  var ROTAS = {};
  ROTAS[BASE + 'dashboard/'] = { elId: 'rota-dashboard', chave: 'dashboard' };
  ROTAS[BASE + 'express/'] = { elId: 'rota-pedidos', chave: 'pedidos' };

  function normalizarPath(path){
    if(!path.endsWith('/')) path += '/';
    return path;
  }

  function rotaDe(path){
    path = normalizarPath(path);
    return ROTAS[path] || ROTAS[BASE + 'dashboard/'];
  }

  async function navegarPara(path, opts){
    opts = opts || {};
    path = normalizarPath(path);
    var rota = rotaDe(path);

    if(opts.push !== false) history.pushState({}, '', path);

    Object.keys(ROTAS).forEach(function(p){
      document.getElementById(ROTAS[p].elId).classList.remove('ativa');
    });
    document.getElementById(rota.elId).classList.add('ativa');

    if(window.SidebarShared) SidebarShared.setActive(rota.chave);

    // Inicializa o app daquela rota, só na primeira vez que a rota é visitada.
    if(rota.chave === 'dashboard' && window.DashboardApp && !window.DashboardApp._iniciado){
      window.DashboardApp._iniciado = true;
      await window.DashboardApp.init();
    }
    if(rota.chave === 'pedidos' && window.PedidosApp && !window.PedidosApp._iniciado){
      window.PedidosApp._iniciado = true;
      await window.PedidosApp.init();
    }
  }

  window.addEventListener('popstate', function(){
    navegarPara(location.pathname, {push:false});
  });

  // ---------------- Inicialização ----------------
  (async function initShell(){
    var sessaoSupabase = await SupabaseShared.sessaoAtual();
    if(!sessaoSupabase){ window.location.href = '../'; return; }
    var perfil = await SupabaseShared.buscarPerfil();
    if(!perfil){ window.location.href = '../'; return; }

    document.getElementById('app-shell').hidden = false;

    var rotaInicial = rotaDe(location.pathname);
    await SidebarShared.mount(rotaInicial.chave, {
      onSair: function(){
        SupabaseShared.sair().then(function(){ window.location.href = '../'; });
      },
      onTrocarSenha: function(){ alert('Trocar senha: chega na próxima etapa.'); },
      onGerenciarUsuarios: perfil.nivel === 'admin' ? function(){ GestaoShared.abrirUsuarios(); } : null,
      onGerenciarUnidades: perfil.nivel === 'admin' ? function(){ GestaoShared.abrirUnidades(); } : null
    });
    SidebarShared.setUser(perfil.nome, perfil.nivel === 'admin' ? 'Administrador' : ((perfil.unidade && perfil.unidade.nome) || '—'));

    SidebarShared.onNavClick(function(chave, href, ev){
      navegarPara(href.replace('../', BASE));
      return false; // impede o link de recarregar a página
    });

    navegarPara(location.pathname, {push:false});
  })();
</script>
</body>
</html>
