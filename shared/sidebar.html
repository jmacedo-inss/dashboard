<!-- Sidebar compartilhada entre /dashboard e /express.
     Este arquivo é buscado via fetch() pelo sidebar.js, que substitui os
     tokens {{...}} e injeta o resultado no lugar de <div id="sidebar-mount">.
     Não é uma página sozinha — não abra este arquivo direto no navegador. -->
<aside class="app-sidebar">
  <div class="sidebar-brand">
    <img class="sidebar-logo" src="{{LOGO}}" alt="Logo">
    <span>Grupo J.Macedo</span>
  </div>
  <nav class="sidebar-nav">
    <a href="{{DASH_HREF}}" class="sidebar-link{{DASH_ACTIVE}}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"></line><line x1="18" y1="20" x2="18" y2="4"></line><line x1="6" y1="20" x2="6" y2="16"></line></svg>
      <span>Orçamentos &amp; TAs</span>
    </a>
    <a href="{{PED_HREF}}" class="sidebar-link{{PED_ACTIVE}}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
      <span>Pedidos de Peças</span>
    </a>
  </nav>
  <div class="sidebar-user">
    <button type="button" class="sidebar-user-btn" id="sb-user-btn">
      <span class="sidebar-avatar" id="sb-avatar">?</span>
      <div class="sidebar-user-text">
        <div class="sidebar-user-nome" id="sb-nome">—</div>
        <div class="sidebar-user-unidade" id="sb-unidade">—</div>
      </div>
      <span class="sidebar-user-caret">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </span>
    </button>
    <div class="sidebar-user-menu" id="sb-user-menu">
      <button type="button" id="sb-mi-senha">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        <span>Trocar senha</span>
      </button>
      <button type="button" id="sb-mi-usuarios" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        <span>Gerenciar usuários</span>
      </button>
      <button type="button" id="sb-mi-unidades" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"></path><path d="M5 21V7l8-4v18"></path><path d="M19 21V11l-6-4"></path></svg>
        <span>Gerenciar unidades</span>
      </button>
      <button type="button" id="sb-mi-historico" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span>Histórico geral</span>
      </button>
      <div class="sidebar-menu-sep"></div>
      <button type="button" id="sb-mi-sair" class="danger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        <span>Sair</span>
      </button>
    </div>
  </div>
</aside>
